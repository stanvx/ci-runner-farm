<!doctype html>
<!--
  THROWAWAY PROTOTYPE — issue #11 (scale-set fleet UI). Not shipped: lives outside
  src/, so build-plg.sh never sees it. Delete or fold into the real .page files.

  Three variants of the multi-fleet UI, switchable with ?variant=A|B|C (or the
  floating bar at the bottom / arrow keys). Each variant answers the WHOLE issue
  consistently across the three surfaces it touches — Fleet tab, Settings, and the
  Main dashboard widget — because the answer to "selector or list or stacked"
  decides the other two.

    A  Selector    one fleet at a time, pill picker, today's layout scoped to it
    B  Master rail fleet list on the left, detail + inline config on the right
    C  Stacked     every fleet on screen at once, per-fleet cards, settings accordion
    D  Product     the round-2 design: three separated layers (navigation / operational
                   status / configuration), calculated security posture, one primary
                   state-dependent action, three consolidated metric cards, and
                   task-oriented settings. D also uses the corrected colour semantics
                   (green healthy, blue active, amber degraded, red failed, grey
                   stopped) — A/B/C keep the shipped orange-means-busy, deliberately,
                   so the two readings can be compared side by side.

  Fake data only. No backend, no mutations — buttons are dead. Runs standalone:
      open prototype/multi-fleet.html
  Theme toggle in the switcher bar because Unraid ships light and dark.
-->

    const j=JOBS[(i+f.id.length)%JOBS.length];
    out.push({
      name:(f.mode==='scaleset'? f.scaleSet+'-'+(1000+i) : f.id+'-'+i),
      phase: running ? (busy?'busy':'idle') : 'exited',
      job: busy ? j.wf.toLowerCase() : (running?'waiting for jobs':'exited'),
      repo: busy?j.repo:'', wf: busy?j.wf:'', branch: busy?j.branch:'',
      cpu: busy ? 40+((i*23)%55) : (running?1:0),
      memUsed: busy ? +(1.5+((i*2.7)%(f.memGb*0.6))).toFixed(1) : (running?0.6:0),
      el: busy ? (3+i*7)+'m' : '',
      id: (f.mode==='scaleset'?'jit-':'reg-')+(4200+i*17),
      digest: 'sha256:9f2c'+(1000+i*7)+'…',
    });
  }
  /* Scale-set only: jobs assigned by GitHub that have no container yet. This is the
     starved case the aggregate "up" count hides completely. */
  if(f.mode==='scaleset' && f.assigned>f.up){
    for(let k=0;k<f.assigned-f.up;k++) out.push({
      name:'—', phase:'pending', job:'provisioning', repo:JOBS[k%JOBS.length].repo,
      wf:JOBS[k%JOBS.length].wf, branch:JOBS[k%JOBS.length].branch,
      cpu:0, memUsed:0, el:'', id:'', digest:'',
    });
  }
  return out;
}

/* ---- variant D derivations: everything below is CALCULATED from the fleet's
   configuration, never stored, so the operator can't disagree with it. ---- */

/* One health colour per fleet. Mode is a separate badge — never a colour. */
function health(f){
  if(f.state==='stopped') return 'stopped';
  if(alerts(f).length)    return 'degraded';
  if(f.busy>0)            return 'active';
  return 'healthy';
}
const HEALTH_LABEL = {healthy:'Healthy', active:'Running', degraded:'Degraded', failed:'Failed', stopped:'Stopped'};

/* Security posture. Each check is (condition, what it means), and the fleet's level
   is the worst of them. "Locked" checks are ones the execution profile enforces —
   they render as a value the operator cannot toggle, not as a warning. */
function posture(f){
  const good=[], bad=[];
  /* `clause` is the risk written as a sentence fragment, so the banner can read like
     a sentence instead of a dump of nine field names. */
  const chk=(ok,label,value,why,clause)=> (ok?good:bad).push({label,value,why,clause});
  chk(f.ephemeral==='true', 'Runner lifetime', f.ephemeral==='true'?'Ephemeral':'Persistent',
      'Jobs may retain state between runs.', 'persistent runners are enabled');
  chk(f.executor==='vm', 'Executor', f.executor==='vm'?`Isolated VM · ${f.agent}`:'Local Unraid host',
      'Jobs run on the same host as your array and containers.', 'jobs run on the local Unraid host');
  chk(!f.privileged, 'Privileged mode', f.privileged?'Enabled (Docker-in-Docker)':'Blocked',
      'A privileged container is root-equivalent on its host.', 'privileged mode is enabled');
  chk(!f.sock, 'Host Docker socket', f.sock?'Shared':'Blocked',
      'Sharing the socket gives jobs control of every container on the host.', 'the host Docker socket is shared');
  chk(f.netiso!=='off', 'Network isolation', f.netiso==='strict'?'Strict':f.netiso==='isolate'?'Dedicated bridge':'Disabled',
      'Jobs can reach other local services and the LAN.', 'network isolation is disabled');
  chk(!f.publicRepos, 'Public repositories', f.publicRepos?'Allowed':'Blocked',
      'Fork pull requests would run untrusted code on this fleet.', 'public repositories are allowed');
  chk(!f.sharedCache, 'Package caches', f.sharedCache?'Shared and writable':'Scoped per repository',
      'One repository can poison another repository’s dependencies.', 'package caches are shared and writable');
  chk(f.pinned, 'Runner image', f.pinned?'Pinned digest':'Floating tag',
      'A moving tag can change what executes without a config change.', 'the runner image uses a floating tag');
  chk(f.auth==='app', 'Authentication', f.auth==='app'?'GitHub App':'Personal access token',
      'A PAT carries one person’s access and does not rotate.', 'authentication uses a personal access token');
  return {level: bad.length?'attention':'strong', good, bad};
}

/* One primary action per state; everything else lives in the overflow menu. */
function primary(f){
  const h=health(f);
  if(h==='stopped')  return {label:'Start fleet', kind:'go'};
  if(h==='degraded') return {label:'Review issue', kind:'warn'};
  return {label:'Drain and stop', kind:'normal'};
}
const SECONDARY = ['Restart after active jobs','Force stop…','Run preflight validation','View logs','Delete fleet…'];

/* The short "what is this, where does it run, how risky" line under the title. */
function attrs(f){
  return [
    f.ephemeral==='true' ? 'Ephemeral runners' : 'Persistent runners',
    f.executor==='vm' ? `Isolated VM · ${f.agent}` : 'Local Unraid host',
    f.mode==='scaleset' ? 'Automatic capacity' : (f.autoscale==='off'?'Manual capacity':'Automatic capacity'),
    f.publicRepos ? 'Public repositories allowed' : 'Private repositories only',
  ];
}
const ago = s => s<60 ? s+' seconds ago' : s<3600 ? Math.round(s/60)+' minutes ago' : Math.round(s/3600)+' hours ago';
/* Which fleets are unhappy — the thing the dashboard has to resolve when fleets
   disagree. Deliberately NOT "has queued jobs": a queue is normal operation, and
   flagging it would make every busy fleet red. */
function alerts(f){
  const a=[], starved = f.mode==='scaleset' ? f.assigned-f.up : 0;
  if(f.state==='stopped') a.push('stopped');
  if(f.mode==='scaleset' && f.session==='stale') a.push('session stale — no message for '+Math.round(f.lastMsg/60)+'m');
  if(starved>0) a.push(starved+' assigned job'+(starved>1?'s':'')+' with no runner');
  return a;
}
const worst = f => alerts(f).length ? (f.state==='stopped'?'error':'busy') : 'idle';
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ball = f => `<span class="crf-ball crf-ball-${worst(f)==='error'?'error':worst(f)==='busy'?'busy':'idle'}"></span>`;
const chip = f => `<span class="mode-chip ${f.mode}">${f.mode==='scaleset'?'scale set':'legacy'}</span>`;
const age  = s => s<60 ? s+'s ago' : Math.round(s/60)+'m ago';
const TOT = FLEETS.reduce((a,f)=>({
  up:a.up+f.up, busy:a.busy+f.busy, idle:a.idle+f.idle,
  waiting:a.waiting+(f.mode==='scaleset'?f.assigned:f.queued),
}),{up:0,busy:0,idle:0,waiting:0});
const SICK = FLEETS.filter(f=>alerts(f).length);

function bays(f){
  return `<div class="crf-bays">
    <div class="crf-bay crf-bay-head"><span></span><span>Runner</span><span>Phase</span><span>Job</span><span>CPU</span></div>
    ${runners(f).map(r=>`<div class="crf-bay">
      <span class="crf-ball ${r.phase==='exited'?'':'crf-ball-'+r.phase}"></span>
      <span class="crf-name">${esc(r.name)}</span>
      <span><span class="crf-badge ${r.phase}">${r.phase}</span></span>
      <span class="crf-job">${esc(r.job)}${r.el?` · ${r.el}`:''}</span>
      <span><span class="crf-ubar ${r.cpu>60?'mid':''}"><span style="width:${r.cpu}%"></span></span></span>
    </div>`).join('')}
  </div>`;
}

            : `<span><b class="${x.queued?'crf-c-busy':''}">${x.queued}</b> queued</span>
               <span>autoscale ${esc(x.autoscale)}</span>`}
          <span><b class="crf-c-busy">${x.busy}</b>/<b>${x.up}</b> busy</span>
        </span>
        <button onclick="event.stopPropagation()">Start</button>
        <button onclick="event.stopPropagation()">Stop</button>
      </div>
      ${isOpen?`<div style="padding:8px 12px">
        ${x.mode==='scaleset'
          ? `<div class="rowline crf-muted" style="font-size:12px;gap:16px;margin-bottom:8px">
               <span>scale set <b>${esc(x.scaleSet)}</b></span><span>group <b>${esc(x.group)}</b></span>
               <span>labels <b>${esc(x.labels)}</b></span><span>max <b>${x.max}</b></span>
               <span style="margin-left:auto">Max runners <input type="number" value="${x.max}" style="width:4em"> <button>Apply</button></span>
             </div>`
          : `<div class="rowline crf-muted" style="font-size:12px;gap:16px;margin-bottom:8px">
               <span>labels <b>${esc(x.labels)}</b></span><span>cache <b>${esc(x.cache)}</b></span>
               <span style="margin-left:auto">Scale to <input type="number" value="${x.count}" style="width:4em"> <button>Scale</button></span>
             </div>`}
        ${bays(x)}
      </div>`:''}
    </div>`;
  }).join('')}
  <button>+ Add fleet</button>

  <div class="surface" style="margin-top:26px">Settings tab</div>
  <h2>Settings</h2>
  <div class="cfg" style="max-width:700px;border-color:var(--link-text-color)">
    <h4>Defaults <span class="crf-muted" style="font-size:11px">— every fleet inherits these unless it overrides</span></h4>
    <div class="fld"><label>Mode</label><div class="val"><select><option>legacy (registration token)</option><option>scale set (JIT)</option></select></div></div>
    <div class="fld"><label>Concurrent runners</label><div class="val"><input type="number" value="4"></div></div>
    <div class="fld"><label>Labels</label><div class="val"><input value="self-hosted,unraid,build"><span class="tag">legacy only</span></div></div>
    <div class="fld"><label>Runner group</label><div class="val"><input placeholder="(default)"><span class="tag">legacy only</span></div></div>
    <div class="fld"><label>Memory per runner</label><div class="val"><input value="16g"></div></div>
    <div class="fld"><label>Cache root</label><div class="val"><input value="/mnt/cache/github-runner"></div></div>
  </div>
  ${FLEETS.map(x=>{
    const isOpen = x.id===open;
    const ov = x.mode==='scaleset' ? {'Memory per runner':x.mem} : {'Labels':x.labels,'Concurrent runners':x.count,'Memory per runner':x.mem};
    return `<div class="cfg" style="padding-top:0">
      <div class="rowline" style="padding:9px 0 5px;cursor:pointer" onclick="pick('${isOpen?'':x.id}')">
        <span style="color:var(--alt-text-color);width:10px">${isOpen?'▾':'▸'}</span>
        <b style="font-size:13px">${esc(x.id)}</b>${chip(x)}
        <span class="crf-muted" style="font-size:12px">${Object.keys(ov).length+1} overrides</span>
      </div>
      ${isOpen?`
        <div class="fld"><label>Mode</label><div class="val"><select><option ${x.mode==='legacy'?'selected':''}>legacy (registration token)</option><option ${x.mode==='scaleset'?'selected':''}>scale set (JIT)</option></select><span class="tag override">override</span></div></div>
        ${x.mode==='scaleset'?`
          <div class="fld"><label>Scale set name</label><div class="val"><input value="${esc(x.scaleSet)}"><span class="tag override">override</span></div></div>
          <div class="fld"><label>Runner group</label><div class="val"><input value="${esc(x.group)}"><span class="tag override">override</span></div></div>
          <div class="fld"><label>Labels</label><div class="val"><input value="${esc(x.labels)}" disabled><span class="locked">from the scale set</span></div></div>
          <div class="fld"><label>Concurrent runners</label><div class="val"><input value="${x.max}" disabled><span class="locked">scale set max</span></div></div>
        `:`
          <div class="fld"><label>Labels</label><div class="val"><input value="${esc(x.labels)}"><span class="tag override">override</span></div></div>
          <div class="fld"><label>Runner group</label><div class="val inherited"><input placeholder="(default)"><span class="tag">inherited</span></div></div>
          <div class="fld"><label>Concurrent runners</label><div class="val"><input type="number" value="${x.count}"><span class="tag override">override</span></div></div>
        `}
        <div class="fld"><label>Memory per runner</label><div class="val"><input value="${esc(x.mem)}"><span class="tag override">override</span></div></div>
        <div class="fld inherited"><label>Cache root</label><div class="val"><input value="/mnt/cache/github-runner" disabled><span class="tag">inherited</span></div></div>
        <div style="display:flex;gap:8px;justify-content:flex-end;padding:6px 0 4px"><button>Revert to defaults</button><button>Apply</button></div>
      `:''}
    </div>`;
  }).join('')}

  <div class="surface" style="margin-top:26px">Main dashboard widget</div>
  <h2>Dashboard</h2>
  <div class="widget" style="width:340px">
    <div class="crfw-head"><span class="crf-ball ${SICK.length?'crf-ball-error':'crf-ball-idle'}"></span>CI Runner Farm</div>
    <table style="width:100%;border-collapse:collapse;margin:8px 0;font-size:.8rem">
      <tr style="color:var(--alt-text-color);font-size:.7rem;text-transform:uppercase"><th style="text-align:left;font-weight:400">Fleet</th><th style="font-weight:400">Up</th><th style="font-weight:400">Busy</th><th style="font-weight:400">Queue</th></tr>
      ${FLEETS.map(x=>`<tr style="border-top:1px solid var(--table-border-color)">
        <td style="padding:3px 0"><span class="rowline" style="gap:6px">${ball(x)}<span class="crf-name" style="font-size:11.5px">${esc(x.id)}</span></span></td>
        <td style="text-align:center">${x.up}</td>
        <td style="text-align:center" class="${x.busy?'crf-c-busy':''}">${x.busy}</td>
        <td style="text-align:center" class="${(x.mode==='scaleset'?x.assigned:x.queued)?'crf-c-busy':''}">${x.mode==='scaleset'?x.assigned:x.queued}</td>
      </tr>`).join('')}
      <tr style="border-top:1px solid var(--border-color);font-weight:600"><td style="padding:3px 0">All</td><td style="text-align:center">${TOT.up}</td><td style="text-align:center">${TOT.busy}</td><td style="text-align:center">${TOT.waiting}</td></tr>
    </table>
    <div class="crfw-foot"><span class="crf-c-err">${SICK.map(x=>esc(x.id)+': '+esc(alerts(x)[0])).join(' · ')||'all fleets healthy'}</span><a href="#" style="margin-left:auto">Manage ›</a></div>
  </div>`;
}

/* =================================================================== VARIANT D
   Round 2. Three separated layers: fleet NAVIGATION (left rail), OPERATIONAL
   STATUS (identity header, posture, three cards, runner table), CONFIGURATION
   (a narrow task-oriented settings column, well below the fold).

   Differences that carry the argument:
   - One primary action, chosen by state; consequential ones are in the overflow.
   - Security posture is calculated from config and shown before any metric.
   - Six metric cards collapse to Capacity / Queue / Storage; autoscale moves into
     the capacity control because it is configuration, not a measurement.
   - Colour means health only: green healthy, blue active, amber degraded, red
     failed, grey stopped. Mode is a badge with no colour of its own.
   - The runner table names the repository, the workflow and the ref, and
     scale-set rows use real lifecycle states including assigned-but-unprovisioned. */
function VariantD(sel, sec, openRunner, menuOpen){
  const f = FLEETS.find(x=>x.id===sel) || FLEETS[0];
  const h = health(f), p = posture(f), prim = primary(f), a = alerts(f);
  const auto = f.mode==='scaleset' || f.autoscale!=='off';
  const rs = runners(f);

  const card = (title, big, sub, extra='') =>
    `<div class="d-card"><div class="d-card-t">${title}</div><div class="d-card-v">${big}</div>
     <div class="d-card-s">${sub}</div>${extra}</div>`;

  const secs = {
    'General':`
      <div class="fld"><label>Fleet name</label><div class="val"><input value="${esc(f.id)}"></div></div>
      <div class="fld"><label>Description</label><div class="val"><input value="${esc(f.desc)}"></div></div>
      <div class="fld"><label>Status</label><div class="val"><span class="d-dot d-${h}"></span> ${HEALTH_LABEL[h]}</div></div>
      <div class="fld"><label>Mode</label><div class="val" style="flex-direction:column;align-items:flex-start;gap:6px">
        <span>${f.mode==='scaleset'?'Runner scale set (JIT)':'Legacy registration runners'}</span>
        ${f.mode==='legacy'?`<button>Migrate to runner scale set</button>
        <span class="d-note">A migration, not a setting — it changes credentials, runner identity and lifecycle behaviour, so it runs as a guided flow.</span>`:''}
      </div></div>`,
    'GitHub access':`
      <div class="fld"><label>Organisation</label><div class="val"><input value="${esc(f.org)}"></div></div>
      <div class="fld"><label>Runner group</label><div class="val"><input value="${esc(f.runnerGroup)}"></div></div>
      <div class="fld"><label>Repository access</label><div class="val"><span>${esc(f.repoAccess)}</span><button>Choose repositories</button></div></div>
      <div class="fld"><label>Authentication</label><div class="val">${f.auth==='app'
        ? '<span class="d-pill ok">GitHub App connected</span>'
        : '<span class="d-pill warn">Personal access token</span><button>Connect a GitHub App</button>'}</div></div>`,
    'Execution':`
      <div class="fld"><label>Execution backend</label><div class="val" style="flex-direction:column;align-items:flex-start;gap:4px">
        <label class="d-radio"><input type="radio" name="dx" ${f.executor==='vm'?'checked':''}> Isolated runner VM</label>
        <label class="d-radio"><input type="radio" name="dx" ${f.executor==='unraid'?'checked':''}> Local Unraid host</label>
        <label class="d-radio"><input type="radio" name="dx"> Remote runner agent</label>
      </div></div>
      ${f.executor==='vm'?`<div class="fld"><label>Agent</label><div class="val"><span class="d-dot d-healthy"></span> ${esc(f.agent)} · Healthy · 8 CPU · 16 GB available</div></div>`:''}
      <div class="fld"><label>Security profile</label><div class="val" style="flex-direction:column;align-items:flex-start;gap:4px">
        ${['Restricted build','Container build','Full Docker integration','GPU workload','Custom']
          .map(x=>`<label class="d-radio"><input type="radio" name="dp" ${f.profile===x?'checked':''}> ${x}</label>`).join('')}
      </div></div>
      <div class="d-note">The profile enforces the combination — it is what makes “Ephemeral” read-only on a restricted fleet instead of a toggle someone can quietly turn off.</div>`,
    'Capacity':`
      <div class="fld"><label>Capacity mode</label><div class="val"><span class="d-pill">${auto?'Automatic':'Manual'}</span></div></div>
      ${auto?`
        <div class="fld"><label>Minimum runners</label><div class="val"><input type="number" value="${f.min??2}"></div></div>
        <div class="fld"><label>Maximum runners</label><div class="val"><input type="number" value="${f.max??16}"></div></div>
        <div class="fld"><label>Warm idle runners</label><div class="val"><input type="number" value="${f.warm??2}"></div></div>
      `:`
        <div class="fld"><label>Desired runners</label><div class="val"><input type="number" value="${f.count}"></div></div>
      `}`,
    'Resources':`
      <div class="fld"><label>CPU per runner</label><div class="val"><input type="number" value="${f.cpus}"><span class="d-unit">cores</span></div></div>
      <div class="fld"><label>Memory per runner</label><div class="val"><input type="number" value="${f.memGb}"><span class="d-unit">GB</span></div></div>
      <div class="fld"><label>Job timeout</label><div class="val"><input type="number" value="${f.timeout}"><span class="d-unit">minutes</span></div></div>
      <div class="fld"><label>Workspace</label><div class="val"><input type="number" value="${f.workspace}"><span class="d-unit">GB</span></div></div>`,
    'Caching':`
      <div class="fld"><label>Cache isolation</label><div class="val" style="flex-direction:column;align-items:flex-start;gap:4px">
        <label class="d-radio"><input type="radio" name="dc" ${!f.sharedCache?'checked':''}> Per repository</label>
        <label class="d-radio"><input type="radio" name="dc" ${f.sharedCache?'checked':''}> Shared across this fleet</label>
        <label class="d-radio"><input type="radio" name="dc"> Disabled</label>
      </div></div>
      <div class="fld"><label>Cache limit</label><div class="val"><input type="number" value="${f.cacheLimit}"><span class="d-unit">GB</span></div></div>
      <div class="fld"><label>Storage pool</label><div class="val"><select><option>cache</option><option>disk1</option></select></div></div>
      <div class="fld"><label>Current usage</label><div class="val"><span>${f.cacheUsed} GB</span><button>Inspect cache</button><button>Clear package cache</button></div></div>`,
    'Security':`
      <div class="d-secgrid">
        ${p.bad.concat(p.good).map(c=>`<div class="d-secrow">
          <span class="d-seck">${esc(c.label)}</span>
          <span class="d-secv ${p.bad.includes(c)?'bad':'ok'}">${esc(c.value)}</span>
          <span class="d-secwhy">${p.bad.includes(c)?esc(c.why):'&nbsp;'}</span>
        </div>`).join('')}
      </div>
      <div class="d-note">Values enforced by the <b>${esc(f.profile)}</b> profile are shown, not offered — a locked safe value beats a dangerous toggle. Combinations that cannot be made safe (public repositories on a privileged fleet) are rejected on save rather than warned about.</div>`,
    'Advanced':`
      <div class="fld"><label>Cache path</label><div class="val"><input value="/mnt/cache/github-runner/${esc(f.id)}"></div></div>
      <div class="fld"><label>Runner labels</label><div class="val">${f.mode==='scaleset'
        ? `<span class="d-locked">Defined by the scale set — the container cannot change them</span>`
        : `<input value="${esc(f.labels)}">`}</div></div>
      <div class="fld"><label>Runner image</label><div class="val"><input value="ghcr.io/stanvx/ci-runner:2026.7@sha256:9f2c…"></div></div>
      <div class="d-note">Diagnostics: config is stored per fleet under <code>/boot/config/plugins/ci-runner-farm/fleets/${esc(f.id)}.cfg</code>; unset keys fall back to the fleet defaults.</div>`,
  };
  const secName = secs[sec] ? sec : 'General';

  return `
  <div class="surface">Fleet tab</div>
  <div class="d-shell">
    <nav class="d-rail">
      <div class="d-rail-h">Fleets</div>
      ${FLEETS.map(x=>{
        const hx=health(x);
        return `<div class="d-rail-row ${x.id===f.id?'on':''}" onclick="pick('${x.id}')">
          <span class="d-dot d-${hx}" title="${HEALTH_LABEL[hx]}"></span>
          <span class="d-rail-n">${esc(x.id)}</span>
          <span class="d-mode">${x.mode==='scaleset'?'Scale set':'Legacy'}</span>
        </div>`;
      }).join('')}
      <div class="d-rail-add"><button>+ Add fleet</button></div>
    </nav>

    <section class="d-main">
      <div class="d-id">
        <div class="grow">
          <h1 class="d-title">${esc(f.id)}</h1>
          <div class="d-sub">${esc(f.desc)}</div>
          <div class="d-statusline">
            <span class="d-dot d-${h}"></span><b>${HEALTH_LABEL[h]}</b>
            <span class="d-sep">·</span><span>${f.up} runner${f.up===1?'':'s'}</span>
            <span class="d-sep">·</span><span class="crf-muted">Updated ${ago(f.updated)}</span>
          </div>
        </div>
        <div class="d-actions">
          <button class="d-primary ${prim.kind}">${prim.label}</button>
          <div class="d-menu">
            <button onclick="set('menu', ${menuOpen?"''":"'1'"})">More ▾</button>
            ${menuOpen?`<div class="d-menu-list">${SECONDARY.map(x=>`<span${/Force stop|Delete/.test(x)?' class="danger"':''}>${x}</span>`).join('')}</div>`:''}
          </div>
        </div>
      </div>
      <div class="d-attrs">${attrs(f).map(x=>`<span>${esc(x)}</span>`).join('')}</div>

      ${a.length?`<div class="d-alert degraded">
        <b>${esc(f.id)} is degraded</b>
        <div>${a.map(esc).join(' · ')}</div>
        <button>Review issue</button></div>`:''}

      ${p.level==='strong'
        ? `<div class="d-alert strong"><b>Security · Strong</b>
             <div>${p.good.slice(0,5).map(c=>`<span class="d-pill ok">${esc(c.label)}: ${esc(c.value)}</span>`).join('')}</div></div>`
        : (()=>{
            const top = p.bad.slice(0,2), rest = p.bad.length-top.length;
            const s = top.map(c=>c.clause).join(' and ');
            return `<div class="d-alert attention"><b>Security needs attention</b>
             <div>${esc(s.charAt(0).toUpperCase()+s.slice(1))}.${rest?` <span class="crf-muted">+${rest} more finding${rest>1?'s':''}</span>`:''}</div>
             <div class="crf-muted">${top.map(c=>esc(c.why)).join(' ')}</div>
             <button onclick="openSec('Security')">Review security settings</button></div>`;
          })()}

      <div class="d-cards">
        ${card('Capacity', `${f.up} / ${auto?(f.max??f.count):f.count} online`,
          `${f.busy} busy · ${f.idle} idle`,
          `<div class="d-meter"><span style="width:${f.up?100*f.busy/f.up:0}%"></span></div>
           <div class="d-card-x">Capacity mode: <b>${auto?'Automatic':'Manual'}</b><br>
           ${auto?`${f.min??2} minimum · ${f.max??16} maximum · ${f.warm??2} warm`
                 :`Desired runners: ${f.count}`}</div>`)}
        ${(()=>{
          const q = f.mode==='scaleset'?f.assigned:f.queued;
          const urgent = q>0 && (f.queueOldest>=5 || q>f.up);
          return `<div class="d-card ${urgent?'urgent':''}"><div class="d-card-t">Queue</div>
            <div class="d-card-v">${q} job${q===1?'':'s'} ${f.mode==='scaleset'?'assigned':'waiting'}</div>
            <div class="d-card-s">${q?`Oldest: ${f.queueOldest} minute${f.queueOldest===1?'':'s'}`:'Nothing waiting'}</div>
            ${urgent?`<div class="d-card-x amber">${f.queueOldest>=5
              ? 'Waiting longer than the 5 minute threshold.'
              : 'More jobs assigned than runners online.'}</div>`:''}</div>`;
        })()}
        ${card('Storage', `${f.cacheUsed} GB cache`,
          `${f.cacheLimit} GB limit · ${Math.round(100*f.cacheUsed/f.cacheLimit)}% used`,
          `<div class="d-meter"><span style="width:${Math.round(100*f.cacheUsed/f.cacheLimit)}%"></span></div>`)}
      </div>

      <div class="d-tbl">
        <div class="d-tr d-th"><span>Runner</span><span>State</span><span>Repository / job</span><span>Executor</span><span>Resources</span></div>
        ${rs.map(r=>{
          const st = r.phase==='pending' ? 'Provisioning'
                   : r.phase==='busy'    ? 'Running'
                   : r.phase==='idle'    ? 'Ready' : 'Cleaning up';
          const stc = r.phase==='pending' ? 'degraded' : r.phase==='busy' ? 'active' : r.phase==='idle' ? 'healthy' : 'stopped';
          const isOpen = openRunner===r.name && r.name!=='—';
          return `<div class="d-tr ${isOpen?'on':''}" onclick="openRunnerPanel('${esc(isOpen?'':r.name)}')">
            <span class="crf-name">${esc(r.name)}</span>
            <span><span class="d-dot d-${stc}"></span> ${st}</span>
            <span class="d-job">${r.repo
              ? `<b>${esc(r.repo)}</b><br><span class="crf-muted">${esc(r.wf)} · ${esc(r.branch)}${r.el?` · running for ${r.el}`:''}</span>`
              : '<span class="crf-muted">Waiting for a job</span>'}</span>
            <span class="crf-muted">${f.executor==='vm'?esc(f.agent):'Unraid'}</span>
            <span class="d-res">${r.phase==='pending'?'<span class="crf-muted">—</span>':
              `<b>${r.cpu}%</b> · <b>${r.memUsed} GB</b><div class="d-meter thin"><span style="width:${r.cpu}%"></span></div>`}</span>
          </div>
          ${isOpen?`<div class="d-panel">
            <div><span>Repository</span>${esc(r.repo||'—')}</div>
            <div><span>Workflow</span>${esc(r.wf||'—')} ${r.branch?'· '+esc(r.branch):''}</div>
            <div><span>Runner ID</span>${esc(r.id)}</div>
            <div><span>Executor host</span>${f.executor==='vm'?esc(f.agent):'Unraid host'}</div>
            <div><span>Started</span>${r.el?r.el+' ago':'—'}</div>
            <div><span>Resources</span>${r.cpu}% CPU · ${r.memUsed} GB of ${f.memGb} GB</div>
            <div><span>Image digest</span><code>${esc(r.digest)}</code></div>
            <div><span>Security profile</span>${esc(f.profile)}</div>
            <div class="d-panel-log">[runner] downloading actions/checkout@v4
[runner] ##[group]Run pnpm install
[runner] Lockfile is up to date, resolution step is skipped</div>
            <div class="d-panel-act"><button>Stop runner</button><button>Full log</button></div>
          </div>`:''}`;
        }).join('')}
      </div>
    </section>
  </div>

  <div class="surface" style="margin-top:26px">Settings tab</div>
  <div class="d-settings">
    <h2 style="margin-top:6px">${esc(f.id)} settings</h2>
    <div class="d-acc">
      ${Object.keys(secs).map(k=>`
        <div class="d-acc-h ${k===secName?'on':''}" onclick="openSec('${k}')">${k}<span>${k===secName?'▾':'▸'}</span></div>
        ${k===secName?`<div class="d-acc-b">${secs[k]}</div>`:''}`).join('')}
    </div>
    <div class="d-save"><button>Discard</button><button class="d-primary normal">Save changes</button></div>
  </div>

  <div class="surface" style="margin-top:26px">Add fleet — final wizard step</div>
  <div class="d-settings">
    <div class="d-wiz">
      <div class="d-wiz-steps">${['Purpose','Execution','GitHub access','Capacity','Review'].map((s,i)=>
        `<span class="${i===4?'on':'done'}">${i+1}. ${s}</span>`).join('')}</div>
      <p class="d-wiz-sum">This fleet will run <b>ephemeral</b> Android builds on <b>ci-runner-vm-01</b>.
      It can be used by <b>3 selected repositories</b>. It cannot reach your Unraid host,
      the LAN, or the host Docker daemon. Maximum concurrency: <b>2</b>.</p>
      <div class="d-save"><button>Back</button><button class="d-primary go">Create fleet</button></div>
    </div>
  </div>

  <div class="surface" style="margin-top:26px">Main dashboard widget</div>
  <div class="widget" style="width:340px">
    <div class="crfw-head"><span>CI Runner Farm</span></div>
    <div class="d-wsum">${FLEETS.length} fleets · ${TOT.up} runners · ${TOT.waiting} jobs queued</div>
    <div class="d-wcounts">
      ${['healthy','active','degraded','stopped'].map(k=>{
        const n=FLEETS.filter(x=>health(x)===k).length;
        return n?`<span><span class="d-dot d-${k}"></span>${n} ${k}</span>`:'';
      }).join('')}
    </div>
    ${FLEETS.map(x=>{
      const hx=health(x), q=x.mode==='scaleset'?x.assigned:x.queued;
      return `<div class="d-wrow"><span class="d-dot d-${hx}"></span>
        <span class="crf-name grow">${esc(x.id)}</span>
        <span class="crf-muted">${hx==='stopped'?'Stopped':`${x.busy}/${x.up} busy${q?` · ${q} ${x.mode==='scaleset'?'assigned':'queued'}`:''}`}</span></div>`;
    }).join('')}
    <div class="crfw-foot" style="margin-top:6px"><span>&nbsp;</span><a href="#">Open ›</a></div>
  </div>`;
}

/* ------------------------------------------------------------------- switcher */
const VARIANTS = {A:['Selector',VariantA], B:['Master rail',VariantB], C:['Stacked cards',VariantC], D:['Product',VariantD]};
const qs = new URLSearchParams(location.search);
const v  = (qs.get('variant')||'D').toUpperCase();
const cur = VARIANTS[v] ? v : 'D';
const sel = qs.get('fleet') || (cur==='C' ? 'org-scaleset' : 'default');

/* file:// has a null origin, so history.pushState throws — just set location. */
function set(k,val){
  const p = new URLSearchParams(location.search);
  val ? p.set(k,val) : p.delete(k);
  location.search = '?'+p.toString();
}
function pick(id){ set('fleet', id); }
function openSec(name){ set('sec', name); }
function openRunnerPanel(name){ set('runner', name); }
function cycle(d){
  const ks = Object.keys(VARIANTS);
  set('variant', ks[(ks.indexOf(cur)+d+ks.length)%ks.length]);
}
if((qs.get('theme')||'dark')==='light') document.body.classList.add('light');

document.getElementById('app').innerHTML = VARIANTS[cur][1](sel, qs.get('sec'), qs.get('runner'), qs.get('menu')==='1');
document.body.insertAdjacentHTML('beforeend', `
  <div id="sw">
    <button onclick="cycle(-1)" aria-label="previous variant">←</button>
    <span class="lab">${cur} · ${VARIANTS[cur][0]}</span>
    <button onclick="cycle(1)" aria-label="next variant">→</button>
    <span class="sep"></span>
    <button onclick="(function(){const p=new URLSearchParams(location.search);p.set('theme',(p.get('theme')||'dark')==='dark'?'light':'dark');location.search='?'+p.toString();})()">${(qs.get('theme')||'dark')==='dark'?'☀':'☾'}</button>
  </div>`);

addEventListener('keydown', e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(e.key==='ArrowLeft') cycle(-1);
  if(e.key==='ArrowRight') cycle(1);
});
</script>
</body>
