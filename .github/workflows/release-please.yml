name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer commit must not interrupt an in-flight release publication.
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr: ${{ steps.release.outputs.pr || '' }}
      release_created: ${{ steps.release.outputs.release_created || 'false' }}
      tag_name: ${{ steps.release.outputs.tag_name || '' }}
    steps:
      - id: release
        name: Release Please
        uses: googleapis/release-please-action@0dfd8538845b8e92600d271a895a5372865d4062
        with:
          token: ${{ secrets.UNRAID_BOT_GITHUB_ADMIN_TOKEN || github.token }}

  # On the open release PR, regenerate the self-contained .plg so its version
  # entities and embedded payload match the version release-please just bumped,
  # then commit it back onto the PR branch.
  prepare-plugin-release-pr:
    needs: release-please
    if: ${{ needs.release-please.outputs.pr != '' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Checkout release PR
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
          token: ${{ secrets.UNRAID_BOT_GITHUB_ADMIN_TOKEN || github.token }}
          fetch-depth: 0

      # build-plg.sh compiles the scale-set listener to stamp its MD5 into the .plg.
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version-file: daemon/go.mod
          cache-dependency-path: daemon/go.sum

      - name: Prepare plugin release metadata
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json;print(json.load(open(".release-please-manifest.json"))["."])')"
          printf '%s\n' "$version" > VERSION
          chmod +x build-plg.sh
          INTERNAL_VERSION="$version" ./build-plg.sh

      - name: Commit plugin release metadata
        shell: bash
        env:
          RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          if [[ -z "$(git status --porcelain)" ]]; then
            echo "Plugin release metadata is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION ci-runner-farm.plg
          git commit -m "chore(release): prepare plugin metadata"
          git push origin "HEAD:$RELEASE_BRANCH"

      - name: Validate prepared release branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BRANCH: ${{ fromJSON(needs.release-please.outputs.pr).headBranchName }}
        run: |
          set -euo pipefail
          # Bot-authored pushes do not trigger CI; dispatch after metadata is final.
          gh workflow run lint.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"
          gh workflow run package-plugins.yml --repo "$GITHUB_REPOSITORY" --ref "$RELEASE_BRANCH"

  validate-plugin-release:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}

  # When the release PR merges and release-please cuts the tag + GitHub Release,
  # attach the tagged .plg as the release asset that CA / Unraid installs from.
  publish-plugin-release:
    needs:
      - release-please
      - validate-plugin-release
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Upload validated plugin release artifacts
        env:
          GH_TOKEN: ${{ secrets.UNRAID_BOT_GITHUB_ADMIN_TOKEN || github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name "release-$RELEASE_TAG" --dir release-artifacts
          downloaded="$(mktemp -d)"
          trap 'rm -rf "$downloaded"' EXIT
          # Make both verified payloads retrievable before exposing the installer.
          assets=(release-artifacts/*.tgz release-artifacts/crf-scalesetd-* release-artifacts/ci-runner-farm.plg)
          for asset in "${assets[@]}"; do
            [[ -f "$asset" ]] || { echo "Missing release asset: $asset" >&2; exit 1; }
            gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" "$asset" --clobber
            filename="${asset##*/}"
            curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
              --output "$downloaded/$filename" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$filename"
            cmp "$asset" "$downloaded/$filename"
          done
